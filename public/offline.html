<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Ajuste de Cuentas</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafaf9;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0c0a09; color: #f5f5f4; }
        .nota { color: #a8a29e; }
        button { border-color: #44403c; color: inherit; }
      }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      .nota { color: #57534e; line-height: 1.5; margin: 0 0 1.25rem; }
      button {
        font: inherit;
        font-weight: 600;
        padding: .6rem 1rem;
        border: 1px solid #d6d3d1;
        border-radius: .6rem;
        background: transparent;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p class="nota">
        No pudimos cargar la página. Ajuste de Cuentas siempre muestra la información actualizada, así que
        necesita internet. Vuelve a intentarlo cuando tengas conexión.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
